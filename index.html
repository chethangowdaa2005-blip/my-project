<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Project</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 650px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #24292f;
      background-color: #f6f8fa;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 10px;
      border: 1px solid #d0d7de;
    }
    h1 {
      margin-top: 0;
      color: #0969da;
    }
    button {
      background-color: #2da44e;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My First GitHub Project!</h1>
    <p>This webpage is hosted directly in my GitHub repository.</p>
    <button onclick="showMessage()">Click Me</button>
    <p id="output" style="font-weight: bold; margin-top: 16px;"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("output").textContent = "Hello from GitHub! Your code is working.";
    }
  </script>
</body>
</html>
